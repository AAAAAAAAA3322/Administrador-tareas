{% extends 'tareas/base.html' %}

{% block titulo %}Iniciar sesión{% endblock %}
{% block cabecera %}{% endblock %}

{% block contenido %}
<h1>Iniciar sesión</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Entrar</button>
</form>

<p><a href="{% url 'principal' %}">Volver a la página principal</a></p>
{% endblock %}
