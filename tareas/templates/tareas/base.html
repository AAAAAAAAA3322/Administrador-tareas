<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Planificador{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        header { display: flex; align-items: center; gap: 24px; padding: 12px 24px;
                 border-bottom: 2px solid #333; }
        header a { text-decoration: none; color: #222; font-weight: bold; }
        header .derecha { margin-left: auto; }
        header .pronto { font-weight: bold; color: #999; cursor: default; }
        .solo-perfil { display: flex; justify-content: flex-end; padding: 16px 24px; }
        .perfil { width: 38px; height: 38px; border: 2px solid #333; border-radius: 50%;
                  display: flex; align-items: center; justify-content: center;
                  text-decoration: none; color: #222; font-weight: bold;
                  cursor: pointer; list-style: none; background: #fff; }
        .perfil::-webkit-details-marker { display: none; }
        .perfil-login { width: 110px; height: 110px; text-align: center; font-size: 15px; }
        .usuario { position: relative; }
        .menu-usuario { position: absolute; right: 0; top: 46px; z-index: 10; min-width: 170px;
                        background: #fff; border: 2px solid #333; border-radius: 6px; padding: 6px; }
        .menu-usuario a, .menu-usuario button { display: block; width: 100%; box-sizing: border-box;
                        padding: 8px 10px; text-align: left; background: none; border: 0;
                        font: inherit; color: #222; text-decoration: none; cursor: pointer; }
        .menu-usuario a:hover, .menu-usuario button:hover { background: #eee; }
        main { padding: 24px; }

        /* Tarjetas de tareas: rejilla de 3 en 3 */
        .tarjetas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
                    gap: 20px; margin-bottom: 28px; }
        .tarjeta { min-height: 260px; border: 2px solid #333; border-radius: 8px;
                   display: flex; flex-direction: column; }
        .parte { padding: 10px 14px; }
        .parte + .parte { border-top: 2px solid #333; }
        .parte.nombre { flex: 1; display: flex; justify-content: space-between;
                        align-items: flex-start; gap: 10px; }
        .parte.objetivos { flex: 2; }
        .parte.pie { flex: 1; }
        .parte h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
        .parte ul { margin: 0; padding-left: 20px; overflow-wrap: anywhere; }
        .parte p, .parte form { margin: 4px 0; }
        .tarjeta-ajustes { text-decoration: none; color: #222; font-weight: bold; font-size: 14px;
                           border: 2px solid #333; border-radius: 6px; padding: 4px 10px; }
        .boton-borrar { color: #b00020; border: 2px solid #b00020; background: #fff;
                        border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
        @media (max-width: 900px) { .tarjetas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 600px) { .tarjetas { grid-template-columns: 1fr; } }

        table.cal { border-collapse: collapse; width: 100%; }
        table.cal td, table.cal th { border: 1px solid #999; padding: 6px; vertical-align: top; }
    </style>
</head>
<body>
    {% block cabecera %}
    <header>
        {% block menu %}
            <a href="{% url 'tareas_activas' %}">TAREAS ACTIVAS</a>
            <a href="{% url 'calendario' %}">CALENDARIO</a>
            <a href="{% url 'principal' %}">PÁGINA PRINCIPAL</a>
        {% endblock %}
        <div class="derecha">{% include 'tareas/_usuario.html' %}</div>
    </header>
    {% endblock %}
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
