{% extends 'tareas/base.html' %}

{% block titulo %}Crear usuario{% endblock %}
{% block cabecera %}{% endblock %}

{% block contenido %}
<h1>Crear usuario</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>

<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a></p>
<p><a href="{% url 'principal' %}">Volver a la página principal</a></p>
{% endblock %}
